{{ define "main" }}

<div class="list-header">
  <h1>{{ .Title }}</h1>
</div>

<div class="posts-wrap" style="margin-top: 1px;">
  {{ range .Pages.ByDate.Reverse }}
  <a class="card" href="{{ .RelPermalink }}">
    <span class="tag">{{ with .Params.tags }}{{ index . 0 }}{{ end }}</span>
    <h3 class="card-title">{{ .Title }}</h3>
    <p class="card-excerpt">{{ .Summary }}</p>
    <div class="card-meta">{{ .Date.Format "2006 · 01 · 02" }}</div>
  </a>
  {{ end }}
</div>

{{ end }}
